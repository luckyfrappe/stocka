<form class="form" action="" method="POST">
    {% csrf_token %}
    <div class="accordion">
        <div class="purchase-option bg-light border mb-2">
            <div class="option-header fw-bold text-uppercase small d-flex justify-content-between align-items-center py-3 px-3 pointer"
                data-bs-toggle="collapse" 
                data-bs-target="#rentOption" 
                aria-expanded="false">
                <span>Rent</span>
                <span>from {{ product.price_per_week }} SEK <i class="fa-solid fa-chevron-down nav-chevron ms-2"></i></span>
            </div>

            <div id="rentOption" class="collapse" data-bs-parent="#purchaseAccordion">
                <input type="hidden" name="purchase_type" value="rent">
                <div class="px-3 pb-3">
                    
                    <p class="small text-muted mb-3">Weekly rental with flexible size changes.</p>
                    <!-- Used to simulate fake availability of new items -->
                    {% if simulated_sizes %}
                    <p class="x-small fw-bold text-uppercase mb-2">Select Size:</p>
                    <select class="form-control rounded-0 mb-2 text-uppercase" name="product_size" id='id_product_size_new'>
                        {% for size in simulated_sizes %}
                            <option value="{{ size|slugify }}" {% if size == real_size %}selected{% endif %}>{{ size }}</option>
                        {% endfor %}
                    </select>
                    {% endif %}

                    <div class="col-12 mb-4">
                        <label class="x-small fw-bold text-uppercase mb-2">Quantity</label>
                        <div class="input-group w-50">
                            <button class="decrement-qty btn btn-outline-dark rounded-0 btn-sm" 
                                type="button" data-item_id="{{ product.id }}">
                                <i class="fas fa-minus"></i>
                            </button>
                            <input class="form-control qty_input rounded-0 border-dark text-center" type="number" 
                                name="quantity" value="1" min="1" max="99" 
                                data-item_id="{{ product.id }}" id="id_qty_rent_{{ product.id }}">
                            <button class="increment-qty btn btn-outline-dark rounded-0 btn-sm" 
                                type="button" data-item_id="{{ product.id }}">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>

                    <div class="rental-period">
                        <p class="x-small fw-bold text-uppercase mb-2">Rental Period:</p>
                        <select class="form-control rounded-0 mb-4" name="rental_period" id='id_rental_period'>
                            <option value="1_week" selected>1 Week</option>
                            <option value="2_weeks">2 Weeks</option>
                            <option value="3_weeks">3 Weeks</option>
                            <option value="4_weeks">4 Weeks</option>
                        </select>
                    </div>

                    <div class="start-datum">
                        <p class="x-small fw-bold text-uppercase mb-2">Start Date:</p>
                        <input type="date" class="form-control rounded-0 mb-4" name="start_date" id="id_start_date">
                    </div>
                    {% if request.user.is_authenticated %}
                        <button type="submit" class="btn btn-dark text-uppercase w-100 py-2 small">
                            Add to Bag
                        </button>
                    {% else %}
                        <a href="{% url 'account_login' %}" class="btn btn-dark text-uppercase w-100 py-2 small">
                            Log in to Rent
                        </a>
                    {% endif %}

                    <div class="rental-summary mt-3 text-center">
                        <span class="small mb-0 fw-bold">End Date: <span id="rental_end_date">—</span>,</span>
                        <span class="small mb-0 fw-bold">Total Price: <span id="rental_total_price">—</span> SEK</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
